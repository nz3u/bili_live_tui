# 测试发布流水线：结构与 master 的 release.yaml 完全一致，仅用于验证构建与发布流程。
#
# 与正式发布的区别：
#   1. 只处理 -test* 标签，正式标签（v1.2.9 等）不会走到这里；
#   2. Release 标记为 prerelease，且不会抢占 master 的 Latest 标记。
#
# 触发方式：推送 v*-test* 标签，例如
#   git tag v1.2.9-test1 && git push origin v1.2.9-test1
#
# 产物命名沿用正式版格式，便于对比：
#   bililive-v1.2.9-test1-linux-amd64.tar.gz / .md5
#   bililive-v1.2.9-test1-windows-amd64.zip  / .md5
name: Release (test)

on:
  push:
    tags:
      - 'v*-test*'

permissions:
  contents: write

# 与正式发布共用同一把锁：即使两者同时被触发，也不会并发覆盖同一个 Release 的 assets
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # 与 release.yaml 同理：go-release-action 只会向已存在的 Release 上传 assets，
  # 不会创建 Release，因此必须先建好一个可见（非 draft）的 Release
  create-release:
    name: Create test release
    runs-on: ubuntu-latest
    steps:
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，跳过创建（后续会按需覆盖同名 assets）"
          else
            echo "创建测试 Release $TAG"
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG (test)" \
              --generate-notes \
              --prerelease
          fi

  releases-matrix:
    name: Release Go Binary
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [ linux, darwin ]
        goarch: [ "386", amd64, arm64 ]
        exclude:
          - goarch: "386"
            goos: darwin
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: wangyoucao577/go-release-action@v1
        with:
          github_token: ${{ github.token }}
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}
          project_path: "./cmd/tui"
          binary_name: "bililive"
          release_tag: ${{ github.ref_name }}
          overwrite: true
          extra_files: LICENSE README.MD config.toml

  releases-win-matrix:
    name: Release Go Binary
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [ windows ]
        goarch: [ "386", amd64, arm64 ]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: wangyoucao577/go-release-action@v1
        with:
          github_token: ${{ github.token }}
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}
          project_path: "./cmd/tui"
          binary_name: "bililive"
          release_tag: ${{ github.ref_name }}
          overwrite: true
          extra_files: LICENSE README.MD config.toml
